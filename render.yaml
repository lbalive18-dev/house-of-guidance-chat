# House of Guidance Chat - Render free-tier blueprint (no card required).
# ONE web service only: the backend image supervises nginx ($PORT),
# PHP-FPM, Reverb, the queue worker, and the scheduler loop in a single
# container, because 24/7 operation of one service (~720 instance-hours
# per month) is all the 750-hour free budget holds. Do NOT add separate
# worker/cron/private services on the free plan.
services:
  - type: web
    name: house-of-guidance-chat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: supervisord -c /var/www/html/docker/supervisord.conf
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # REQUIRED and must be stable: without a persistent APP_KEY the server
      # generates a throwaway key on every boot, which silently logs out all
      # users and kills every pending email-verification link on each
      # restart/redeploy (Render free services restart often). Generate one
      # locally with
      #   $b = New-Object byte[] 32; (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($b); 'base64:' + [Convert]::ToBase64String($b)
      # paste the whole `base64:...` string here, and never change it again
      # unless you accept logging everyone out (same reason password-reset
      # and verification links die when the key rotates).
      - key: APP_KEY
        sync: false
      # Production SPA is served by the Cloudflare Worker.
      - key: FRONTEND_URL
        value: https://house-of-guidance-chat.lbalive18.workers.dev
      # Backend's own public URL. NEVER leave the localhost default here:
      # signed email-verification links are built from it, and a localhost
      # link is dead on arrival in every user's browser.
      - key: APP_URL
        value: https://house-of-guidance-chat.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: house-of-guidance-chat.lbalive18.workers.dev
      - key: CORS_ALLOWED_ORIGINS
        value: https://house-of-guidance-chat.lbalive18.workers.dev
      - key: RUN_MIGRATIONS
        value: true
      # Seeds once on a fresh database only (guarded; safe to leave on).
      - key: RUN_SEEDS
        value: true
      - key: DB_CONNECTION
        value: pgsql
      # Use the provider's direct PostgreSQL hostname for migrations.
      # For Neon, turn off connection pooling (the hostname must omit -pooler).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      # Two-week sessions so the app stays logged in like a real mobile app.
      # (Still requires a stable APP_KEY — without it every redeploy logs
      # everyone out no matter the lifetime.)
      - key: SESSION_LIFETIME
        value: 20160
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: none
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        sync: false
      - key: MAIL_MAILER
        value: brevo-api
      # Brevo HTTPS API key (free 300/day). Verification and password-reset
      # emails cannot send until this is set — create it under Brevo
      # dashboard SMTP & API, paste it here, and redeploy.
      - key: BREVO_API_KEY
        sync: false
      - key: PUBLIC_DISK_DRIVER
        value: supabase
      - key: AVATARS_DISK_DRIVER
        value: supabase
      - key: CHAT_ATTACHMENTS_DISK_DRIVER
        value: supabase
      - key: VOICE_NOTES_DISK_DRIVER
        value: supabase
      # Configure these two values in the Render dashboard; never commit them.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: hog-uploads
      # First admin claim via the web app (no Shell on the free plan).
      # Set to your own registered email in the Render dashboard.
      - key: FIRST_ADMIN_EMAIL
        sync: false
      # Web Push (free VAPID standard) keys. The public key is NOT a secret
      # (browsers see it); the private key is — never commit it. Pushes are
      # refused without BOTH halves matching the pair.
      - key: WEBPUSH_VAPID_PUBLIC
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE
        sync: false
      # Noor assistant (Groq free tier). The app works without it (local +
      # cached answers); model answers need this key from console.groq.com.
      - key: GROQ_API_KEY
        sync: false
