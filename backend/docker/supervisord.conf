; House of Guidance Chat - single-container process routing for hosts
; without paid background workers (Render free tier). Render starts this
; file as its Docker command AFTER docker/entrypoint.sh has run migrations:
;     supervisord -c /var/www/html/docker/supervisord.conf
; The Oracle path is untouched (separate containers per process there).
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/sh -c "sed -e \"s/@@PORT@@/${PORT:-10000}/g\" /var/www/html/docker/nginx/render.conf.template > /etc/nginx/http.d/app.conf && exec nginx -g 'daemon off;'"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Bound to localhost on purpose: nginx (same container) proxies the public
# Pusher paths to it, and Render's port scanner must only ever see nginx
# on $PORT — a second public-looking listener confuses primary-port
# detection and can route HTTP traffic into the socket server instead.
[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work --sleep=10 --tries=3
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
