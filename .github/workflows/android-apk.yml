# Builds the Android debug APK on GitHub's free runners — no local Android
# SDK needed, no card, no cost. The APK appears under the run's Artifacts.
#
# Required repository Secrets (Settings → Secrets → Actions):
#   VITE_API_URL, VITE_REVERB_APP_KEY, VITE_REVERB_HOST, VITE_REVERB_PORT,
#   VITE_REVERB_SCHEME, VITE_VAPID_PUBLIC_KEY  (same values as a production
#   web build; the VAPID public key is public by design)
#   ANDROID_GOOGLE_SERVICES_JSON  (base64 of google-services.json from the
#   Firebase console — real file content, so it stays a secret)
#
# Manual runs: Actions tab → "Android APK" → Run workflow.

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing ANDROID_GOOGLE_SERVICES_JSON secret. Add your Firebase google-services.json (base64) under repo Settings → Secrets → Actions, then re-run."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Write production env from secrets
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          {
            echo "VITE_API_URL=$VITE_API_URL"
            echo "VITE_REVERB_APP_KEY=$VITE_REVERB_APP_KEY"
            echo "VITE_REVERB_HOST=$VITE_REVERB_HOST"
            echo "VITE_REVERB_PORT=$VITE_REVERB_PORT"
            echo "VITE_REVERB_SCHEME=$VITE_REVERB_SCHEME"
            echo "VITE_VAPID_PUBLIC_KEY=$VITE_VAPID_PUBLIC_KEY"
          } > .env.production
          node -e "const fs=require('fs');for(const k of ['VITE_API_URL','VITE_REVERB_APP_KEY','VITE_REVERB_HOST','VITE_VAPID_PUBLIC_KEY']){if(!process.env[k]){console.error('Missing secret: '+k);process.exit(1)}}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: house-of-guidance-chat-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
