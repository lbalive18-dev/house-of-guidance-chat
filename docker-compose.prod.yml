name: house-of-guidance-chat-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: hogchat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      REVERB_DOMAIN: ${REVERB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend-nginx
      - reverb
    networks:
      - hogchat

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hogchat-backend:latest
    container_name: hogchat-backend
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
    env_file:
      - ./backend/.env
    volumes:
      - backend-storage:/var/www/html/storage/app/public
      - backend-public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hogchat

  queue:
    image: hogchat-backend:latest
    container_name: hogchat-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-jobs=1000
    env_file:
      - ./backend/.env
    volumes:
      - backend-storage:/var/www/html/storage/app/public
    depends_on:
      - backend
    networks:
      - hogchat

  reverb:
    image: hogchat-backend:latest
    container_name: hogchat-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    networks:
      - hogchat

  scheduler:
    image: hogchat-backend:latest
    container_name: hogchat-scheduler
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    networks:
      - hogchat

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: hogchat-backend-nginx
    restart: unless-stopped
    volumes:
      - backend-public:/var/www/html/public:ro
      - backend-storage:/var/www/html/public/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - hogchat

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${REVERB_DOMAIN}
        VITE_REVERB_PORT: 443
        VITE_REVERB_SCHEME: https
    container_name: hogchat-frontend
    restart: unless-stopped
    networks:
      - hogchat

  mysql:
    image: mysql:8.4
    container_name: hogchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hogchat

  redis:
    image: redis:7-alpine
    container_name: hogchat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - hogchat

networks:
  hogchat:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  backend-storage:
  backend-public:
  caddy-data:
  caddy-config:
